exclude: |
  (?x)^(
    workflow/vendor/|
    \.git/|
    dist/|
    __pycache__/|
    .*\.min\.js$|
    .*\.min\.css$
  )

repos:
  # Ruff: fast linter + formatter (replaces flake8, isort, pyupgrade, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.7
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # General file hygiene + security basics
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]  # allow custom tags in GitHub Actions YAML
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs
      - id: check-case-conflict
      - id: detect-private-key

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        files: scripts/.*\.sh$

  # Secret scanning — uses .gitleaks.toml for project-specific rules
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        args: [--config=.gitleaks.toml]

  # Block .env files from being committed
  - repo: local
    hooks:
      - id: detect-dotenv
        name: Block .env files
        language: fail
        entry: '.env ファイルはコミット禁止。ダミー値のみの .env.example を使うこと。'
        files: '(^|/)\.env(\.[^.]+)?$'
        exclude: '(^|/)\.env\.(example|sample|template)$'

  # Block hardcoded local absolute paths
  - repo: local
    hooks:
      - id: no-hardcoded-local-paths
        name: Block hardcoded local absolute paths
        language: pygrep
        entry: '(/Users/[A-Za-z0-9_.-]+/|/home/[A-Za-z0-9_.-]+/|C:\\Users\\)'
        types_or: [text]
        exclude: |
          (?x)(
            \.md$|
            docs/|
            \.github/|
            \.gitleaks\.toml$|
            \.pre-commit-config\.yaml$
          )

  # ----------------------------------------------------------------
  # Charter CI template check
  # (blocks if .github/workflows/dev-charter-check.yml drifted from the
  # template documented in the installed dev-charter's README-jp.md)
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-charter-ci-template
        name: Check charter CI template
        language: script
        entry: scripts/check-charter-ci-template.sh
        pass_filenames: false
        always_run: true

  # Markdown section headings
  - repo: local
    hooks:
      - id: check-markdown-heading-language
        name: Check Markdown section heading language
        language: script
        entry: scripts/check-markdown-heading-language.sh
        files: '\.md$'

  # Type checking (runs mypy against src/)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        language: python
        entry: mypy
        args: [src]
        additional_dependencies: ["mypy>=1.0"]
        types: [python]
        pass_filenames: false

  # ----------------------------------------------------------------
  # PowerShell scripts
  # (PSScriptAnalyzer, installed locally on first run. Skipped in CI —
  # see ci.yml's SKIP env — it isn't required to gate merges; it exists
  # for local parity with the Linux/macOS shellcheck coverage above,
  # for scripts/*.ps1 counterparts of the bash scripts.)
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: powershell-lint
        name: PowerShell script lint (PSScriptAnalyzer)
        language: system
        entry: >-
          bash -c '
          if ! command -v pwsh >/dev/null 2>&1; then
          echo "warning: pwsh not found; skipping PowerShell lint" >&2;
          exit 0;
          fi;
          pwsh -NoProfile -NonInteractive -File scripts/check-powershell-lint.ps1 "$@"
          ' --
        files: '\.ps1$'
        require_serial: true

  # ----------------------------------------------------------------
  # Local dev-charter version check
  # (blocks if sibling ../dev-charter is newer, warns if older)
  # ----------------------------------------------------------------
  - repo: local
    hooks:
      - id: check-local-charter-version
        name: Check local dev-charter version
        language: script
        entry: scripts/check-local-charter-version.sh
        pass_filenames: false
        always_run: true
